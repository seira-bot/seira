name: ${COMPOSE_PROJECT_NAME:-seira-podman}
services:
  seira:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile
      args:
        ENGINES: ${ENGINES:-}
    image: localhost/seira-podman:${SEIRA_IMAGE_TAG:-local}
    # Collects exited browser processes; Chrome's shared memory as on the
    # desktop containers (docs/browser-packaging.md, "Process hygiene").
    init: true
    shm_size: 512m
    userns_mode: keep-id:uid=1001,gid=1001
    user: "1001:1001"
    restart: unless-stopped
    # On Windows this is the Linux Podman machine. The app must reach the
    # dynamically allocated, loopback-only desktop ports on that same host.
    network_mode: host
    volumes:
      - ${SEIRA_DATA_ROOT:?Run setup.sh first}:${SEIRA_DATA_ROOT}
      - ${PODMAN_SOCKET:?Run setup.sh first}:/run/seira-podman.sock
    environment:
      HOME: ${SEIRA_DATA_ROOT}
      SEIRA_DATA_DIR: ${SEIRA_DATA_ROOT}/.seira
      SEIRA_STATIC_DIR: /app/dist
      CONTAINER_HOST: unix:///run/seira-podman.sock
      SEIRA_PORT: ${SEIRA_PORT:-8799}
      SEIRA_WEBHOOK_PORT: ${SEIRA_WEBHOOK_PORT:-8800}
      SEIRA_PUBLIC_URL: ${SEIRA_PUBLIC_URL:-http://localhost:8080}
      SEIRA_WEBHOOK_PUBLIC_URL: ${SEIRA_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:$$SEIRA_PORT/api/health | grep -q -e seira -e openmausbot']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: docker.io/library/caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    depends_on:
      seira:
        condition: service_healthy
    environment:
      SEIRA_HTTP_PORT: ${SEIRA_HTTP_PORT:-8080}
      SEIRA_PORT: ${SEIRA_PORT:-8799}
      SEIRA_WEBHOOK_PORT: ${SEIRA_WEBHOOK_PORT:-8800}
      SEIRA_HTTPS_HOST: ${SEIRA_HTTPS_HOST:-https-disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
