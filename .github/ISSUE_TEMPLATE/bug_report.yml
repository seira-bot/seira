name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat UI (src/)
        - Harness server / API (server/)
        - Provider drivers (claude / codex / grok)
        - Computer use (cloud box / local)
        - Connected apps (Composio)
        - Desktop shell / packaging (electron/)
        - Docs
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead?
      placeholder: |
        1. Opened the Computer panel on a fresh bot
        2. Expected the box to provision
        3. Got a spinner forever; the server log says …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and install
      description: App version (About or release tag), your OS, and how you installed it (AppImage, .dmg, or from source)
      placeholder: v0.1.170 AppImage · Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Anything from the terminal running `pnpm dev:server`, or the per-thread
        event logs in `~/.openmausbot/events/`. Redact anything that looks like
        a key or token before pasting.
      render: text
