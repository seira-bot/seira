name: msstore publish

# Submits the Windows Store package of a stable release to the Microsoft Store (docs/releasing.md). It follows the pattern of snap-publish.yml.
# - A published release (not a draft, not a prerelease) starts it. The `redispatch` job runs this workflow again on `main`.
#   By hand, `tag` names the release tag.
# - Only a run on `main` goes on. A run on another ref fails in the `commit` job and never reaches a credential.
# - The `commit` job resolves the tag once to a commit SHA and checks that the SHA is in the history of `main`.
#   It also needs a published release that is not a prerelease. The later jobs use the SHA, never the tag name.
# - The `gate` job runs scripts/release-gate.mjs on that SHA. A run that the gate flags waits for the `release-approval` environment.
# - The `build` job has no secret. It builds the Store package and checks it with scripts/check-appx.mjs.
# - The `publish` job uses the `microsoft-store` environment and runs only after the gate, the approval and the build.
#   Only that job reads the four MSSTORE_* credentials. It runs no code of the repository. It stops when a secret is missing
#   or when Partner Center already holds a submission in progress, because `msstore publish` deletes that submission.
# scripts/ci-workflow.test.ts holds these rules.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to submit, like v0.1.195. It must match the version in package.json.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: msstore-publish
  cancel-in-progress: false

jobs:
  redispatch:
    name: start the run on main
    if: ${{ github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start this workflow again on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh workflow run msstore-publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"

  commit:
    name: find the commit to publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      tag: ${{ steps.sha.outputs.tag }}
    steps:
      - name: Find the commit of the tag
        id: sha
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::This workflow reads store credentials. Run it from main, not from $REF."
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag must look like v1.2.3."
            exit 1
          fi
          lines=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" "refs/tags/$TAG^{}")
          # An annotated tag lists its commit on the line that ends in ^{}. A light tag lists it on the plain line.
          sha=$(awk -v peeled="refs/tags/$TAG^{}" '$2 == peeled { print $1 }' <<<"$lines")
          [ -n "$sha" ] || sha=$(awk -v plain="refs/tags/$TAG" '$2 == plain { print $1 }' <<<"$lines")
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The repository has no commit for this tag."
            exit 1
          fi
          # The commit must be in the history of main. `behind` and `identical` mean that main holds it.
          position=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" --jq .status)
          case "$position" in
            identical|behind) ;;
            *) echo "::error::The commit of $TAG is not in the history of main (status: $position)."; exit 1 ;;
          esac
          # A draft release is not visible to this token, so it counts as missing.
          if ! state=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '[.draft, .prerelease] | @tsv'); then
            echo "::error::The Microsoft Store needs a published GitHub release for $TAG. None was found."
            exit 1
          fi
          if [ "$state" != $'false\tfalse' ]; then
            echo "::error::The Microsoft Store needs a published release that is not a draft and not a prerelease."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tag \`$TAG\` is commit \`$sha\`." >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: release gate
    needs: commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pass: ${{ steps.gate.outputs.pass }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run the release gate
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_HUMAN_REVIEWERS: ${{ vars.RELEASE_HUMAN_REVIEWERS }}
          TAG: ${{ needs.commit.outputs.tag }}
          SHA: ${{ needs.commit.outputs.sha }}
        run: |
          set -uo pipefail
          node scripts/release-gate.mjs --tag "$TAG" --sha "$SHA" && status=0 || status=$?
          case "$status" in
            0) echo "pass=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "pass=false" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

  approval:
    name: approval for a run that the gate flagged
    needs: gate
    if: ${{ needs.gate.outputs.pass == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-approval
    permissions: {}
    outputs:
      attempt: ${{ github.run_attempt }}
    steps:
      - run: echo "The wait of the release-approval environment ended."

  build:
    name: build and check the Store package
    needs: [commit, gate, approval]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.commit.result == 'success' && needs.gate.result == 'success' && (needs.gate.outputs.pass == 'true' || (needs.approval.result == 'success' && needs.approval.outputs.attempt == github.run_attempt)) }}
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    outputs:
      file: ${{ steps.stage.outputs.file }}
      sha256: ${{ steps.stage.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # A published package must not read a dependency cache that another run wrote.
          package-manager-cache: false

      - name: Check the version
        id: version
        env:
          TAG: ${{ needs.commit.outputs.tag }}
          SHA: ${{ needs.commit.outputs.sha }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "tag: $TAG, version: $version, commit: $(git rev-parse HEAD)"
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::The checkout is not the commit $SHA."; exit 1; }
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG holds package.json version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Clean generated output
        # The package copies these folders as they are, so stale files would ship.
        run: rm -rf dist dist-server dist-companion dist-native release

      - name: Build the Store package
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm package:appx

      - name: "Gate: the Store package carries the Seira manifest and logos"
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          appx="release/Seira-${VERSION}-x64.appx"
          [ -f "$appx" ] || { echo "::error::the build did not write $appx"; exit 1; }
          extracted="$RUNNER_TEMP/seira-appx"
          rm -rf "$extracted"
          7z x -y -o"$extracted" "$appx" > /dev/null
          node scripts/check-appx.mjs "$extracted"
          [ -f "$extracted/app/resources/job-fence/seira-job-fence.exe" ] || { echo "::error::the Store package has no job-fence/seira-job-fence.exe"; exit 1; }

      - name: Stage the Store package
        id: stage
        env:
          VERSION: ${{ steps.version.outputs.version }}
          STAGE: ${{ runner.temp }}/msstore
        run: |
          set -euo pipefail
          file="Seira-${VERSION}-x64.msix"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          # The msstore tool accepts .msix and rejects .appx. The bytes stay the same.
          cp "release/Seira-${VERSION}-x64.appx" "$STAGE/$file"
          node scripts/store-whats-new.mjs --version "$VERSION" > "$STAGE/whats-new.txt"
          (cd "$STAGE" && sha256sum "$file" > SHA256SUMS-msstore.txt && cat SHA256SUMS-msstore.txt)
          sha256=$(cut -d' ' -f1 "$STAGE/SHA256SUMS-msstore.txt")
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### Seira ${VERSION} Store package"
            echo
            echo "File: \`$file\`"
            echo
            echo "SHA-256: \`$sha256\`"
            echo
            echo "What's new:"
            echo
            echo '```'
            cat "$STAGE/whats-new.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msstore
          path: ${{ runner.temp }}/msstore/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: submit to the Microsoft Store
    needs: [commit, gate, approval, build]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.commit.result == 'success' && needs.build.result == 'success' && needs.gate.result == 'success' && (needs.gate.outputs.pass == 'true' || (needs.approval.result == 'success' && needs.approval.outputs.attempt == github.run_attempt)) }}
    runs-on: windows-2025
    timeout-minutes: 60
    environment: microsoft-store
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msstore
          path: msstore

      - name: Check the package
        env:
          FILE: ${{ needs.build.outputs.file }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          [ -f "msstore/$FILE" ] || { echo "::error::The artifact has no file $FILE."; exit 1; }
          actual=$(sha256sum "msstore/$FILE" | cut -d' ' -f1)
          [ "$actual" = "$SHA256" ] || { echo "::error::The package has SHA-256 $actual, not $SHA256."; exit 1; }
          [ -s msstore/whats-new.txt ] || { echo "::error::The artifact has no What's new text."; exit 1; }

      - name: Install the msstore tool
        # This step has no secret. It runs before every step that reads a MSSTORE_* credential.
        # The digest is the SHA-256 of MSStoreCLI-win-x64.zip in the release v0.4.4 of github.com/microsoft/msstore-cli.
        # It matches the MSStoreCLI-win-x64.zip.sha256.txt file of that release and the digest that the GitHub API shows for the asset.
        # A new tool version needs a new URL and a new digest, taken from the release.
        env:
          MSSTORE_CLI_URL: https://github.com/microsoft/msstore-cli/releases/download/v0.4.4/MSStoreCLI-win-x64.zip
          MSSTORE_CLI_SHA256: d288a324541dc68244a683eb5b6445e9239bb47d1e6acf5cca4d1476017f1447
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/MSStoreCLI-win-x64.zip"
          curl --fail --silent --show-error --location --retry 3 --output "$zip" "$MSSTORE_CLI_URL"
          actual=$(sha256sum "$zip" | cut -d' ' -f1)
          if [ "$actual" != "$MSSTORE_CLI_SHA256" ]; then
            echo "::error::The msstore tool has SHA-256 $actual, not $MSSTORE_CLI_SHA256. The job stops before it uses a credential."
            exit 1
          fi
          tool="$RUNNER_TEMP/msstorecli"
          rm -rf "$tool"
          7z x -y -o"$tool" "$zip" > /dev/null
          [ -f "$tool/msstore.exe" ] || { echo "::error::The archive has no msstore.exe."; exit 1; }
          echo "$tool" >> "$GITHUB_PATH"

      - name: Check the credentials and Partner Center
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          PRODUCT_ID: 9MVFVK4VTFDH
        run: |
          node --input-type=module - <<'EOF'
          const names = ["MSSTORE_TENANT_ID", "MSSTORE_SELLER_ID", "MSSTORE_CLIENT_ID", "MSSTORE_CLIENT_SECRET"];
          const missing = names.filter((name) => !process.env[name]);
          if (missing.length > 0) {
            console.error(`::error::The secret${missing.length > 1 ? "s" : ""} ${missing.join(", ")} ${missing.length > 1 ? "are" : "is"} missing in the microsoft-store environment. Nothing was uploaded. See docs/releasing.md, One-time Microsoft Store setup.`);
            process.exit(1);
          }

          const { MSSTORE_TENANT_ID: tenant, MSSTORE_CLIENT_ID: client, MSSTORE_CLIENT_SECRET: secret, PRODUCT_ID: product } = process.env;
          const api = "https://manage.devcenter.microsoft.com/v1.0/my";
          const fail = (message) => { console.error(`::error::${message}`); process.exit(1); };
          const call = async (label, url, init) => {
            const response = await fetch(url, init);
            const text = await response.text();
            if (!response.ok) fail(`${label} answered ${response.status}: ${text}`);
            return text === "" ? {} : JSON.parse(text);
          };

          const { access_token: token } = await call("The token request", `https://login.microsoftonline.com/${tenant}/oauth2/token`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({ grant_type: "client_credentials", client_id: client, client_secret: secret, resource: "https://manage.devcenter.microsoft.com" }).toString(),
          });
          if (!token) fail("The token request gave no access token.");
          const application = await call("The request for the application", `${api}/applications/${product}`, { headers: { Authorization: `Bearer ${token}` } });
          if (application.pendingApplicationSubmission) {
            fail("Partner Center already has a submission in progress. This run did not change it. Finish or delete that submission in Partner Center, then run this workflow again.");
          }
          console.log("The credentials work and Partner Center has no submission in progress.");
          EOF

      - name: Upload the package
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          FILE: ${{ needs.build.outputs.file }}
          PRODUCT_ID: 9MVFVK4VTFDH
        run: |
          set -euo pipefail
          msstore reconfigure --tenantId "$MSSTORE_TENANT_ID" --sellerId "$MSSTORE_SELLER_ID" --clientId "$MSSTORE_CLIENT_ID" --clientSecret "$MSSTORE_CLIENT_SECRET"
          msstore publish "msstore/$FILE" -id "$PRODUCT_ID" --noCommit

      - name: Set What's new, commit and wait
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          PRODUCT_ID: 9MVFVK4VTFDH
          NOTES_FILE: msstore/whats-new.txt
          TAG: ${{ needs.commit.outputs.tag }}
          SHA: ${{ needs.commit.outputs.sha }}
        run: |
          node --input-type=module - <<'EOF'
          import { appendFileSync, readFileSync } from "node:fs";

          const { MSSTORE_TENANT_ID: tenant, MSSTORE_CLIENT_ID: client, MSSTORE_CLIENT_SECRET: secret, PRODUCT_ID: product, NOTES_FILE, TAG, SHA } = process.env;
          const pollMs = Number(process.env.POLL_SECONDS ?? 30) * 1000;
          const waitMs = Number(process.env.WAIT_MINUTES ?? 30) * 60 * 1000;
          const api = "https://manage.devcenter.microsoft.com/v1.0/my";
          const fail = (message) => { console.error(`::error::${message}`); process.exit(1); };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const call = async (label, url, init) => {
            const response = await fetch(url, init);
            const text = await response.text();
            if (!response.ok) fail(`${label} answered ${response.status}: ${text}`);
            return text === "" ? {} : JSON.parse(text);
          };

          const { access_token: token } = await call("The token request", `https://login.microsoftonline.com/${tenant}/oauth2/token`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({ grant_type: "client_credentials", client_id: client, client_secret: secret, resource: "https://manage.devcenter.microsoft.com" }).toString(),
          });
          if (!token) fail("The token request gave no access token.");
          const auth = { Authorization: `Bearer ${token}` };

          const application = await call("The request for the application", `${api}/applications/${product}`, { headers: auth });
          const id = application.pendingApplicationSubmission?.id;
          if (!id) fail("The upload made no submission in Partner Center.");
          const base = `${api}/applications/${product}/submissions/${id}`;

          const notes = readFileSync(NOTES_FILE, "utf8").replace(/\n+$/, "");
          const submission = await call("The request for the submission", base, { headers: auth });
          const listings = Object.values(submission.listings ?? {});
          if (listings.length === 0) fail("The submission has no listing to hold the What's new text.");
          for (const listing of listings) {
            listing.baseListing = { ...listing.baseListing, releaseNotes: notes };
          }
          await call("The update of the submission", base, { method: "PUT", headers: { ...auth, "Content-Type": "application/json" }, body: JSON.stringify(submission) });
          await call("The commit of the submission", `${base}/commit`, { method: "POST", headers: auth });
          console.log("The submission is committed. Waiting for the commit to finish.");

          const deadline = Date.now() + waitMs;
          let status;
          for (;;) {
            status = await call("The request for the status", `${base}/status`, { headers: auth });
            if (status.status === "CommitFailed") {
              console.error(JSON.stringify(status.statusDetails?.errors ?? [], null, 2));
              fail("The commit of the submission failed.");
            }
            if (status.status !== "CommitStarted") break;
            if (Date.now() + pollMs > deadline) fail("The commit did not finish in time. Check the submission in Partner Center.");
            await sleep(pollMs);
          }

          const line = `Submitted \`${TAG}\` (commit \`${SHA}\`) to the Microsoft Store. Submission \`${id}\`, status \`${status.status}\`.`;
          console.log(line);
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${line}\n`);
          EOF
