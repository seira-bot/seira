name: snap publish

# Uploads the desktop snap `seira` to the Snap Store when a GitHub release is published (docs/releasing.md).
# This is the one workflow that uploads a package to a store without the `release` environment.
# - A published release (not a draft, not a prerelease) starts it, and the snap goes to the `stable` channel.
# - By hand, `tag` names the release tag, and `channel` can be `stable`, `candidate`, `beta` or `edge`.
# - The `build` job has no secret. It builds the snap from the tag and checks it with scripts/check-snap.mjs.
# - The `publish` job uses the `snap-store` environment. Only that job reads SNAPCRAFT_STORE_CREDENTIALS.
#   It fails with a clear message when the secret is missing. It never passes without an upload.
# - It runs no code of the repository. It uploads the file that `build` made.
# scripts/ci-workflow.test.ts holds these rules.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to upload, like v0.1.194. It must match the version in package.json.
        required: true
        type: string
      channel:
        description: The Snap Store channel.
        required: true
        default: stable
        type: choice
        options: [stable, candidate, beta, edge]

permissions:
  contents: read

concurrency:
  group: snap-publish
  cancel-in-progress: false

jobs:
  build:
    name: build and check the snap
    # A release event for a draft or a prerelease does nothing. A manual start always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      channel: ${{ steps.tag.outputs.channel }}
      file: ${{ steps.snap.outputs.file }}
    steps:
      - name: Check the tag and the channel
        id: tag
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then tag="$RELEASE_TAG"; channel=stable; else tag="$INPUT_TAG"; channel="$INPUT_CHANNEL"; fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag must look like v1.2.3."
            exit 1
          fi
          case "$channel" in
            stable|candidate|beta|edge) ;;
            *) echo "::error::The channel must be stable, candidate, beta or edge."; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # A published package must not read a dependency cache that another run wrote.
          package-manager-cache: false

      - name: Check the version
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "tag: $TAG, version: $version, commit: $(git rev-parse HEAD)"
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG holds package.json version $version"; exit 1; }

      - name: Install the squashfs tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the snap
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm package:snap

      - name: Check the snap
        id: snap
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          snaps=(release/*.snap)
          [ "${#snaps[@]}" -eq 1 ] || { echo "::error::Expected one .snap file in release/, found ${#snaps[@]}."; exit 1; }
          node scripts/check-snap.mjs "${snaps[0]}"
          echo "file=$(basename "${snaps[0]}")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snap
          path: release/*.snap
          if-no-files-found: error
          retention-days: 1

  publish:
    name: upload to the Snap Store
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: snap-store
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snap
          path: snap

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Upload to the Snap Store
        shell: bash
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          FILE: ${{ needs.build.outputs.file }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${SNAPCRAFT_STORE_CREDENTIALS:-}" ]; then
            echo "::error::The secret SNAPCRAFT_STORE_CREDENTIALS is missing in the snap-store environment. Nothing was uploaded. See docs/releasing.md, Publish to the Snap Store."
            exit 1
          fi
          snapcraft upload "snap/$FILE" --release="$CHANNEL"
          echo "Uploaded \`$FILE\` for \`$TAG\` to the \`$CHANNEL\` channel of the Snap Store." >> "$GITHUB_STEP_SUMMARY"
