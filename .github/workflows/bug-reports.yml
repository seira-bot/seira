# CI for the bug report Worker (cloudflare/bug-reports, docs/ci.md).
#
# This workflow is separate from ci.yml and is not part of the `CI` gate. It starts only when the Worker or this file changes,
# so a pull request that does not touch the Worker adds no job. It runs the type check and the tests of the Worker.
# The tests use a fake GitHub and a fake database, so no job reads a secret. No job deploys the Worker:
# a deploy stays a manual step (cloudflare/bug-reports/README.md).
# The rules of ci.yml hold here: a read-only token, no secret, credentials dropped at checkout, and every action pinned to a
# full commit SHA. scripts/ci-workflow.test.ts holds these rules.
name: Bug report Worker

on:
  pull_request:
    paths:
      - "cloudflare/bug-reports/**"
      - ".github/workflows/bug-reports.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare/bug-reports/**"
      - ".github/workflows/bug-reports.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels that pull request's older run. A push to main never cancels a run.
  group: bug-reports-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  worker:
    name: bug-reports
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm bugs:check
      - name: Tests
        run: pnpm bugs:test
