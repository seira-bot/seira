# Seira CI: one Linux lane for every pull request and every push to main (docs/ci.md).
#
# Fork pull requests run this workflow safely:
# - the trigger is `pull_request`, never `pull_request_target`, so a fork run gets a read-only token and no secrets;
# - the token can only read the repository, and no job asks for more;
# - no step reads a secret, every checkout drops its credentials, and every action is pinned to a full commit SHA.
# No workflow in this repository creates a tag or publishes a release or a package (docs/releasing.md).
# scripts/ci-workflow.test.ts holds these rules.
name: CI

on:
  pull_request:
    # A draft pull request runs `checks` only. Marking it ready runs the rest.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels that pull request's older run. A new push to main cancels the older main run
  # that is still going, because the newer commit holds the older one. A manual start never cancels or is cancelled.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      # "false" only for a pull request that changes documentation and pictures no source file reads (scripts/ci-heavy.mjs).
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The leak check and the manifest checks compare with the base commit, so they need the history.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Decide if the heavy jobs run
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-heavy.mjs
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate locale catalogs
        run: pnpm i18n:check
      - run: pnpm lint
      - run: pnpm check:contrast
      - name: Validate the model manifest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-model-manifest.mjs --against "$BASE_SHA"
      - name: Validate the announcements file
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-announcements.mjs --against "$BASE_SHA"
      - name: Find local machine details in added lines
        run: node scripts/check-local-leaks.mjs
      - name: Source guards
        # The tests that only read the source. They finish in seconds, so a broken rule shows before the shards start.
        run: pnpm exec vitest run scripts/ci-workflow.test.ts scripts/testing/verification-docs.test.ts src/locales/ scripts/testing/file-size-ratchet.test.ts scripts/testing/index-route-ratchet.test.ts scripts/testing/tighten-ratchets.test.ts scripts/testing/comment-history.test.ts scripts/testing/lazy-server-modules.test.ts scripts/testing/duration-sequencer.test.ts scripts/testing/host-e2e.test.ts scripts/testing/ci-retry-list.test.ts src/lib/copy-text.guard.test.ts src/components/Select.guard.test.ts --reporter=default --reporter=github-actions

  build:
    name: build
    needs: checks
    # Skipped on a draft pull request, and on a pull request that changes documentation and pictures only.
    if: ${{ github.event.pull_request.draft != true && needs.checks.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:electron
      - name: Build the web app
        run: pnpm exec vite build

  vitest:
    # The whole suite in 8 shards. scripts/testing/duration-sequencer.ts splits the files by their recorded seconds,
    # so a failure names the same shard on every run. The shard count and the workers come from
    # scripts/ci-scope.mjs (VITEST_SHARDS and VITEST_WORKERS), and scripts/ci-workflow.test.ts keeps them equal.
    name: vitest (linux, shard ${{ matrix.shard }}/8)
    needs: checks
    # Skipped on a draft pull request, and on a pull request that changes documentation and pictures only.
    if: ${{ github.event.pull_request.draft != true && needs.checks.outputs.heavy == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Electron test runtime
        # Electron downloads its runtime on first import. Do it before the tests, so the download cannot use a test's time.
        run: node --input-type=commonjs -e "require('electron')"
      - name: Run tests
        env:
          OMB_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
          OMB_VITEST_E2E: all
          OMB_VITEST_SUBSET: ""
          OMB_VITEST_WORKERS: 4
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/8 --reporter=default --reporter=github-actions
      - name: Report flaky tests that needed a retry
        if: ${{ !cancelled() }}
        env:
          OMB_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
        run: node scripts/testing/ci-retry-summary.mjs
      - name: Broker and Electron unit tests
        if: matrix.shard == 1
        timeout-minutes: 5
        run: pnpm broker:test && pnpm test:electron

  gate:
    # The one check that the main branch ruleset requires. It runs even when a job before it fails, and it fails then:
    # a skipped required check counts as a pass, so the gate must not skip. Only `build` and `vitest` may be skipped,
    # and only on a draft pull request or a pull request that changes documentation and pictures only (`checks` decides).
    name: CI
    needs: [checks, build, vitest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAVY: ${{ needs.checks.outputs.heavy }}
        run: |
          node --input-type=module -e '
            const needs = JSON.parse(process.env.NEEDS);
            const mayStop = process.env.DRAFT === "true" || process.env.HEAVY === "false";
            const stopped = (job, result) => mayStop && result === "skipped" && (job === "build" || job === "vitest");
            for (const [job, { result }] of Object.entries(needs)) console.log(`${result.padEnd(9)} ${job}`);
            const bad = Object.entries(needs).filter(([job, { result }]) => result !== "success" && !stopped(job, result)).map(([job]) => job);
            if (bad.length) { console.error(`\n${bad.length} job(s) did not pass: ${bad.join(", ")}`); process.exit(1); }
          '
