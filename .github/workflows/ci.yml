# Seira CI: one Linux lane for every pull request, every merge queue entry and every push to main (docs/ci.md).
#
# Fork pull requests run this workflow safely:
# - the trigger is `pull_request`, never `pull_request_target`, so a fork run gets a read-only token and no secrets;
# - the token can only read the repository, and no job asks for more;
# - no step reads a secret, every checkout drops its credentials, and every action is pinned to a full commit SHA.
# No workflow in this repository creates a tag or publishes a release or a package (docs/releasing.md).
# scripts/ci-workflow.test.ts holds these rules.
name: CI

on:
  pull_request:
    # A draft pull request runs `checks` only. Marking it ready runs the rest.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels that pull request's older run. A run on main or in the merge queue is never
  # cancelled, so every commit that lands gets a verdict. GitHub replaces only a run that still waits for a runner.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      # "false" only for a pull request that changes documentation and pictures no source file reads (scripts/ci-heavy.mjs).
      heavy: ${{ steps.scope.outputs.heavy }}
      # A JSON array of the Cloudflare Workers to check: all of them, except for a pull request that touches fewer.
      workers: ${{ steps.scope.outputs.workers }}
      # "true" when the change can break the native job: always, except for a pull request that leaves its files alone.
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The leak check and the manifest checks compare with the base commit, so they need the history.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Decide which jobs run
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: node scripts/ci-heavy.mjs
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate locale catalogs
        run: pnpm i18n:check
      - run: pnpm lint
      - run: pnpm check:contrast
      - name: Validate the model manifest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node scripts/check-model-manifest.mjs --against "$BASE_SHA"
      - name: Validate the announcements file
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node scripts/check-announcements.mjs --against "$BASE_SHA"
      - name: Find local machine details in added lines
        run: node scripts/check-local-leaks.mjs
      - name: Match the Flatpak source list to the lockfile
        run: node scripts/check-flatpak-sources.mjs
      - name: Find new files in private paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-public-paths.mjs --against "$BASE_SHA"
      - name: Source guards
        # The tests that only read the source. They finish in seconds, so a broken rule shows before the shards start.
        run: pnpm exec vitest run scripts/ci-workflow.test.ts scripts/testing/verification-docs.test.ts scripts/check-public-paths.test.ts src/locales/ scripts/testing/file-size-ratchet.test.ts scripts/testing/index-route-ratchet.test.ts scripts/testing/tighten-ratchets.test.ts scripts/testing/comment-history.test.ts scripts/testing/lazy-server-modules.test.ts scripts/testing/duration-sequencer.test.ts scripts/testing/host-e2e.test.ts scripts/testing/ci-retry-list.test.ts src/lib/copy-text.guard.test.ts src/components/Select.guard.test.ts --reporter=default --reporter=github-actions

  build:
    name: build
    needs: checks
    # Skipped on a draft pull request, and on a pull request that changes documentation and pictures only.
    if: ${{ github.event.pull_request.draft != true && needs.checks.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:electron
      - name: Electron unit tests
        timeout-minutes: 5
        run: pnpm test:electron
      - name: Build the web app
        run: pnpm exec vite build

  vitest:
    # The whole suite in 8 shards. scripts/testing/duration-sequencer.ts splits the files by their recorded seconds,
    # so a failure names the same shard on every run. The shard count and the workers come from
    # scripts/ci-scope.mjs (VITEST_SHARDS and VITEST_WORKERS), and scripts/ci-workflow.test.ts keeps them equal.
    name: vitest (linux, shard ${{ matrix.shard }}/8)
    needs: checks
    # Skipped on a draft pull request, and on a pull request that changes documentation and pictures only.
    if: ${{ github.event.pull_request.draft != true && needs.checks.outputs.heavy == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Electron test runtime
        # Electron downloads its runtime on first import. Do it before the tests, so the download cannot use a test's time.
        run: node --input-type=commonjs -e "require('electron')"
      - name: Run tests
        env:
          SEIRA_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
          SEIRA_VITEST_E2E: all
          SEIRA_VITEST_SUBSET: ""
          SEIRA_VITEST_WORKERS: 4
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/8 --reporter=default --reporter=github-actions
      - name: Report flaky tests that needed a retry
        if: ${{ !cancelled() }}
        env:
          SEIRA_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
        run: node scripts/testing/ci-retry-summary.mjs

  workers:
    # The type check and the tests of each Cloudflare Worker that the change can break (scripts/ci-heavy.mjs holds the
    # list). The tests use fake services, so no job reads anything private, and no job deploys a Worker.
    name: worker (${{ matrix.worker.name }})
    needs: checks
    # Skipped on a draft pull request, and when no Worker is in scope.
    if: ${{ github.event.pull_request.draft != true && needs.checks.outputs.workers != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.checks.outputs.workers) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        env:
          CHECK: ${{ matrix.worker.check }}
        run: pnpm run "$CHECK"
      - name: Tests
        env:
          TEST: ${{ matrix.worker.test }}
        run: pnpm run "$TEST"

  server-image:
    # Builds the server image on each platform and boots it (server-image-smoke.yml). The Dockerfile builds the server
    # and the web app, so any change that runs the heavy jobs can break the image.
    name: server image
    needs: checks
    if: ${{ github.event.pull_request.draft != true && needs.checks.outputs.heavy == 'true' }}
    uses: ./.github/workflows/server-image-smoke.yml

  native:
    # The Windows memory helper (native/job-fence) and the macOS memory readers, each on its own system. The tests run
    # with `node --test` and no dependencies, so the job is short: macOS runners are few. scripts/ci-heavy.mjs decides
    # when it runs.
    name: native (${{ matrix.runner }})
    needs: checks
    # Skipped on a draft pull request, and when the change cannot break the native files.
    if: ${{ github.event.pull_request.draft != true && needs.checks.outputs.native == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build the memory helper
        if: ${{ runner.os == 'Windows' }}
        run: node scripts/prepare-job-fence.mjs --test
      - name: Run the native tests
        run: node --test "native/**/*.test.mjs"

  gate:
    # The one check that the main branch ruleset requires. It runs even when a job before it fails, and it fails then:
    # a skipped required check counts as a pass, so the gate must not skip. A job may be skipped only when `checks`
    # says so: `build`, `vitest` and `server-image` on a draft or a documentation-only pull request, `workers` on a
    # draft or when no Worker is in scope, `native` on a draft or when its files are not in scope. Any other skip, a
    # failure, or a cancel fails the gate.
    name: CI
    needs: [checks, build, vitest, workers, server-image, native]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAVY: ${{ needs.checks.outputs.heavy }}
          WORKERS: ${{ needs.checks.outputs.workers }}
          NATIVE: ${{ needs.checks.outputs.native }}
        run: |
          node --input-type=module -e '
            const needs = JSON.parse(process.env.NEEDS);
            const draft = process.env.DRAFT === "true";
            const light = draft || process.env.HEAVY === "false";
            const mayStop = { build: light, vitest: light, "server-image": light, workers: draft || process.env.WORKERS === "[]", native: draft || process.env.NATIVE === "false" };
            for (const [job, { result }] of Object.entries(needs)) console.log(`${result.padEnd(9)} ${job}`);
            const bad = Object.entries(needs).filter(([job, { result }]) => result !== "success" && !(result === "skipped" && mayStop[job] === true)).map(([job]) => job);
            if (bad.length) { console.error(`\n${bad.length} job(s) did not pass: ${bad.join(", ")}`); process.exit(1); }
          '
