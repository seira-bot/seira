# Seira for macOS: the Apple silicon (arm64) and Intel (x64) apps, built on a GitHub-hosted macOS runner (docs/releasing.md).
#
# This workflow only builds. It cannot publish:
# - only a person with write access can start it (`workflow_dispatch`), so a fork pull request never runs it;
# - the token can only read the repository;
# - it uses no dependency cache, so no other run can change what the packages contain;
# - it uploads the packages as a workflow artifact. A maintainer attaches the artifact to the release by hand.
# A run that a person outside the repository variable RELEASE_MAINTAINERS starts waits for a maintainer's approval in the `release-approval` environment.
# A maintainer's run does not wait.
# The `package` job runs only if a maintainer started this attempt, or if the approval came in this same attempt.
# A re-run by another person therefore never reuses an approval of an earlier attempt.
# The `commit` job finds the commit of the ref before the approval. The `package` job builds that commit only.
# The `release` environment accepts `main` only and holds the five Apple secrets (docs/ci.md):
# - all five set: Developer ID signature, notarization, staple, and a Gatekeeper check;
# - none set: ad-hoc signed apps for tests only, in an artifact named NOT-FOR-RELEASE, built without the update feed file;
# - some set: the run stops before it builds.
# scripts/ci-workflow.test.ts holds these rules.
name: Package macOS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch, or commit to build. A v* tag must match the version in package.json.
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  commit:
    name: find the commit to build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Find the commit of the ref
        id: sha
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$REF" ] || [[ "$REF" == -* ]] || [[ "$REF" == *..* ]] || [[ "$REF" =~ [^A-Za-z0-9._/-] ]]; then
            echo "::error::The ref is not a tag, branch or commit name."
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha) || {
            echo "::error::The repository has no commit for this ref."
            exit 1
          }
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The commit id is not a 40-character SHA."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Ref \`$REF\` is commit \`$sha\`." >> "$GITHUB_STEP_SUMMARY"

  approval:
    name: approval for a person outside the maintainers
    needs: commit
    if: ${{ !(startsWith(vars.RELEASE_MAINTAINERS || '[]', '[') && contains(fromJSON(vars.RELEASE_MAINTAINERS || '[]'), github.triggering_actor)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-approval
    permissions: {}
    outputs:
      attempt: ${{ github.run_attempt }}
    steps:
      - run: echo "A maintainer approved this run."

  package:
    name: macOS arm64 and x64 apps
    needs: [commit, approval]
    if: ${{ !cancelled() && needs.commit.result == 'success' && ((startsWith(vars.RELEASE_MAINTAINERS || '[]', '[') && contains(fromJSON(vars.RELEASE_MAINTAINERS || '[]'), github.triggering_actor)) || (needs.approval.result == 'success' && needs.approval.outputs.attempt == github.run_attempt)) }}
    runs-on: macos-15
    timeout-minutes: 120
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - name: Choose a signed or an unsigned build
        id: mode
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set_names=""
          missing=""
          for name in MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [ -n "${!name}" ]; then set_names="$set_names $name"; else missing="$missing $name"; fi
          done
          if [ -z "$set_names" ]; then
            echo "::warning::No Apple secret is set. The apps are ad-hoc signed and not notarized. They are NOT FOR RELEASE."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$missing" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set all five Apple secrets or none of them. Missing:$missing"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # A release package must not read a dependency cache that another run wrote.
          package-manager-cache: false

      - name: Check the version
        id: version
        env:
          REF: ${{ inputs.ref }}
          SIGNED: ${{ steps.mode.outputs.signed }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "ref:     $REF"
          echo "version: $version"
          echo "commit:  $(git rev-parse HEAD)"
          echo "signed:  $SIGNED"
          case "$REF" in
            v[0-9]*)
              [ "$REF" = "v$version" ] || { echo "::error::tag $REF holds package.json version $version"; exit 1; } ;;
          esac
          artifact="seira-$version-macos"
          [ "$SIGNED" = true ] || artifact="$artifact-NOT-FOR-RELEASE"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        # The package copies these folders as they are, so stale files would ship and break the signature seal.
        run: rm -rf dist dist-server dist-companion dist-native release

      - name: Import the Developer ID certificate into a temporary keychain
        if: steps.mode.outputs.signed == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/seira-signing.keychain-db"
          keychain_password="$(uuidgen)"
          trap 'rm -f "$RUNNER_TEMP/cert.p12"' EXIT
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          identities=$(security find-identity -v -p codesigning "$keychain")
          grep -q '"Developer ID Application: ' <<< "$identities" || {
            echo "::error::MAC_CERT_P12_BASE64 holds no Developer ID Application identity"; exit 1; }

      - name: Package both architectures
        env:
          # macos-15 runners have 7 GB. Node's default heap stops near 2 GB, and the server type check needs more.
          NODE_OPTIONS: --max-old-space-size=4096
          SIGNED: ${{ steps.mode.outputs.signed }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.mode.outputs.signed }}
        run: |
          # pnpm adds these options to the last command of the script, the packager.
          if [ "$SIGNED" = true ]; then
            pnpm package:mac -c.forceCodeSigning=true
          else
            # build/entitlements.mac.plist disables library validation, so an ad-hoc signed app with the hardened runtime starts.
            # The ad-hoc apps are never attached to a release, so scripts/after-pack.mjs removes the update feed file from them.
            export SEIRA_NO_UPDATE_FEED=1
            pnpm package:mac -c.mac.identity=- -c.dmg.sign=false
          fi

      - name: "Gate: the update feed file matches the signing mode"
        env:
          SIGNED: ${{ steps.mode.outputs.signed }}
        run: |
          for app in release/mac-arm64/Seira.app release/mac/Seira.app; do
            update="$app/Contents/Resources/app-update.yml"
            if [ "$SIGNED" != true ]; then
              test ! -e "$update" || { echo "::error::an ad-hoc app must not carry $update"; exit 1; }
              continue
            fi
            test -f "$update" || { echo "::error::missing $update"; exit 1; }
            grep -Eq '^provider: github$' "$update" || { echo "::error::$update does not use the github provider"; exit 1; }
            grep -Eq '^owner: seira-bot$' "$update" || { echo "::error::$update does not name owner seira-bot"; exit 1; }
            grep -Eq '^repo: seira$' "$update" || { echo "::error::$update does not name repo seira"; exit 1; }
          done

      - name: "Gate: both apps carry every helper for their own CPU"
        run: |
          pinned=$(node --input-type=module -e "import { CLOUDFLARED_VERSION } from './scripts/prepare-cloudflared.mjs'; console.log(CLOUDFLARED_VERSION)")
          for app in release/mac-arm64/Seira.app release/mac/Seira.app; do
            res="$app/Contents/Resources"
            speech="$res/Seira Speech.app/Contents/MacOS/speech-helper"
            test -x "$speech" || { echo "::error::missing the dictation helper $speech"; exit 1; }
            # The dictation helper is one universal binary in both apps.
            archs=$(lipo -archs "$speech")
            [[ " $archs " == *" x86_64 "* && " $archs " == *" arm64 "* ]] || { echo "::error::$speech has only: $archs"; exit 1; }
            for file in "$res/server/index.js" "$res/ui/index.html" "$res/licenses/cloudflared-LICENSE.txt" "$res/licenses/cloudflared-README.md"; do
              test -f "$file" || { echo "::error::missing $file"; exit 1; }
            done
            expected_arch=x86_64
            case "$app" in *mac-arm64*) expected_arch=arm64 ;; esac
            cloudflared="$res/cloudflared/cloudflared"
            for bin in "$res/cua-driver" "$res/cua-sdk/native/libcua_driver_sdk.dylib" \
              "$res/cua-sdk/native/cua_driver_node_runtime.node" "$res/android-platform-tools/darwin/adb" "$cloudflared"; do
              test "$(lipo -archs "$bin")" = "$expected_arch" || {
                echo "::error::$bin is not the expected $expected_arch executable"; exit 1; }
            done
            if [ "$(uname -m)" = "$expected_arch" ]; then
              version_line=$("$cloudflared" version)
              grep -Fq "cloudflared version $pinned " <<< "$version_line" || { echo "::error::$cloudflared is not version $pinned"; exit 1; }
            fi
            echo "ok: $app"
          done

      - name: "Gate: the signature verifies before notarization"
        env:
          SIGNED: ${{ steps.mode.outputs.signed }}
        run: |
          # Apple's notary service accepts some invalid signatures, so this check runs first.
          team_of() { codesign -dv --verbose=4 "$1" 2>&1 | sed -n 's/^TeamIdentifier=//p'; }
          for app in release/mac-arm64/Seira.app release/mac/Seira.app; do
            res="$app/Contents/Resources"
            codesign --verify --deep --strict "$app"
            bins=("$res/Seira Speech.app" "$res/cloudflared/cloudflared" "$res/browser-engine/agent-browser")
            for chrome in "$res/browser-engine/chrome/"*/chrome-headless-shell; do bins+=("$chrome"); done
            for bin in "${bins[@]}"; do
              test -e "$bin" || { echo "::error::missing $bin"; exit 1; }
              codesign --verify --strict "$bin"
            done
            if [ "$SIGNED" = true ]; then
              app_team=$(team_of "$app")
              case "$app_team" in "" | "not set") echo "::error::$app has no Developer ID team"; exit 1 ;; esac
              for bin in "${bins[@]}"; do
                test "$(team_of "$bin")" = "$app_team" || { echo "::error::$bin is not signed by team $app_team"; exit 1; }
              done
            fi
            echo "ok: $app"
          done

      - name: "Gate: the bundled browser works with an empty home"
        run: |
          case "$(node -p process.arch)" in
            arm64) resources="$GITHUB_WORKSPACE/release/mac-arm64/Seira.app/Contents/Resources" ;;
            x64) resources="$GITHUB_WORKSPACE/release/mac/Seira.app/Contents/Resources" ;;
            *) exit 1 ;;
          esac
          node scripts/smoke-browser-bundle.mjs --resources "$resources"
          SEIRA_SMOKE_DIST="$resources/server" node scripts/smoke-packaged-server.mjs --browser-bundle "$resources/browser-engine"

      - name: "Gate: both packaged servers start and every helper path resolves"
        run: |
          for app in release/mac-arm64/Seira.app release/mac/Seira.app; do
            res="$app/Contents/Resources"
            # The server is plain JavaScript, so the runner's Node starts the x64 copy too.
            SEIRA_SMOKE_DIST="$res/server" node scripts/smoke-packaged-server.mjs \
              || { echo "::error::the packaged server in $app did not start"; exit 1; }
            node scripts/check-module-scopes.mjs "$res"
            node --input-type=module - "$res/server" <<'EOF'
          import { existsSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          const server = process.argv[2];
          const { SPAWNED_PROXIES } = await import(pathToFileURL(`${server}/proxy-paths.js`));
          const missing = Object.entries(SPAWNED_PROXIES).filter(([, path]) => !existsSync(path));
          if (missing.length) {
            console.error("unresolved proxies:", missing);
            process.exit(1);
          }
          console.log(`ok: ${Object.keys(SPAWNED_PROXIES).length} proxies resolve in ${server}`);
          EOF
          done

      - name: Notarize the two dmg and the two zip files
        if: steps.mode.outputs.signed == 'true'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/notary.p8"' EXIT
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          notary() {
            xcrun notarytool "$@" --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
          }
          for file in release/*.dmg release/*.zip; do
            # notarytool exits non-zero when Apple refuses the request (an agreement to accept, a bad key).
            rc=0
            out=$(notary submit "$file" --wait 2>&1) || rc=$?
            if [ "$rc" -eq 0 ] && grep -q "status: Accepted" <<< "$out"; then
              tail -2 <<< "$out"
              continue
            fi
            echo "$out"
            echo "::error::notarization is not Accepted for $file (notarytool exit code $rc)"
            id=$(sed -n 's/^ *id: *\([0-9A-Fa-f-]\{1,\}\) *$/\1/p' <<< "$out" | head -1)
            if [ -n "$id" ]; then
              echo "notarytool log $id:"
              notary log "$id" 2>&1 || echo "could not get the notarization log for $id"
            fi
            exit 1
          done

      - name: Staple, zip again, and make the blockmaps and the update feed again
        if: steps.mode.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # stapler gets the ticket from Apple's CloudKit. The connection drops now and then (error 68), and a ticket
          # can come a minute after notarytool says Accepted (error 65).
          staple() {
            for attempt in 1 2 3 4 5 6; do
              xcrun stapler staple "$1" && return 0
              echo "stapling $1 failed (attempt $attempt of 6); trying again in 30 s"
              sleep 30
            done
            echo "::error::could not staple $1 after 6 attempts"
            return 1
          }
          for file in "release/Seira-$VERSION-arm64.dmg" "release/Seira-$VERSION-x64.dmg" release/mac-arm64/Seira.app release/mac/Seira.app; do
            staple "$file"
          done
          # Stapling changes the bytes, so the zips, the blockmaps, and the hashes in latest-mac.yml must change too.
          rm -f "release/Seira-$VERSION-arm64.zip" "release/Seira-$VERSION-x64.zip"
          ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/Seira.app "release/Seira-$VERSION-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent release/mac/Seira.app "release/Seira-$VERSION-x64.zip"
          node scripts/regenerate-blockmaps.mjs \
            "release/Seira-$VERSION-arm64.zip" "release/Seira-$VERSION-x64.zip" \
            "release/Seira-$VERSION-arm64.dmg" "release/Seira-$VERSION-x64.dmg"
          node scripts/regenerate-mac-feed.mjs

      - name: "Gate: Gatekeeper accepts the stapled apps and disk images"
        if: steps.mode.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for app in release/mac-arm64/Seira.app release/mac/Seira.app; do
            xcrun stapler validate "$app"
            out=$(spctl --assess --type execute --verbose=4 "$app" 2>&1) || { echo "$out"; echo "::error::Gatekeeper rejects $app"; exit 1; }
            echo "$out"
            grep -q "source=Notarized Developer ID" <<< "$out" || { echo "::error::$app is not notarized"; exit 1; }
          done
          for dmg in "release/Seira-$VERSION-arm64.dmg" "release/Seira-$VERSION-x64.dmg"; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          done

      - name: Stage and verify the files to upload
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.mode.outputs.signed }}
          STAGE: ${{ runner.temp }}/seira-macos
        run: |
          node --input-type=module - <<'EOF'
          import { createHash } from "node:crypto";
          import { appendFileSync, copyFileSync, linkSync, mkdirSync, readFileSync, readdirSync, rmSync, statSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const { VERSION: version, STAGE: stage } = process.env;
          const signed = process.env.SIGNED === "true";
          const fail = (message) => { console.error(`::error::${message}`); process.exit(1); };
          const packages = ["arm64.dmg", "x64.dmg", "arm64.zip", "x64.zip"].map((end) => `Seira-${version}-${end}`);
          const hash = (algorithm, file, encoding) => createHash(algorithm).update(readFileSync(join(stage, file))).digest(encoding);
          // A hard link costs no disk space. The runner has little free space after two app builds.
          const put = (from, to) => {
            try { linkSync(from, join(stage, to)); } catch { try { copyFileSync(from, join(stage, to)); } catch { fail(`the build did not write ${from}`); } }
          };

          rmSync(stage, { recursive: true, force: true });
          mkdirSync(stage, { recursive: true });
          let expected;
          if (signed) {
            const blockmaps = packages.map((file) => `${file}.blockmap`);
            for (const file of [...packages, ...blockmaps, "latest-mac.yml"]) put(join("release", file), file);
            // The /releases/latest/download/ links need names without a version.
            put(join("release", packages[0]), "Seira.dmg");
            put(join("release", packages[1]), "Seira-intel.dmg");

            // Installed apps download the file that latest-mac.yml names and reject it unless the SHA-512 and size match.
            const feed = readFileSync(join(stage, "latest-mac.yml"), "utf8");
            const feedVersion = feed.match(/^version:\s+['"]?([^'"\n]+)['"]?$/m)?.[1];
            if (feedVersion !== version) fail(`latest-mac.yml names version ${feedVersion}, not ${version}`);
            const entries = [...feed.matchAll(/url:\s+(\S+)[\s\S]*?sha512:\s+(\S+)\n\s+size:\s+(\d+)/g)];
            const listed = entries.map(([, url]) => url).sort();
            if (JSON.stringify(listed) !== JSON.stringify([...packages].sort())) fail(`latest-mac.yml lists ${listed.join(", ") || "no file"}`);
            for (const [, url, sha512, size] of entries) {
              if (hash("sha512", url, "base64") !== sha512) fail(`the SHA-512 in latest-mac.yml does not match ${url}`);
              if (statSync(join(stage, url)).size !== Number(size)) fail(`the size in latest-mac.yml does not match ${url}`);
            }

            const sums = [...packages, "Seira.dmg", "Seira-intel.dmg"].map((file) => `${hash("sha256", file, "hex")}  ${file}\n`).join("");
            writeFileSync(join(stage, "SHA256SUMS-mac.txt"), sums);
            process.stdout.write(sums);
            expected = [...packages, ...blockmaps, "latest-mac.yml", "Seira.dmg", "Seira-intel.dmg", "SHA256SUMS-mac.txt"];
          } else {
            for (const file of packages) put(join("release", file), file);
            writeFileSync(join(stage, "NOT-FOR-RELEASE.txt"), [
              "These apps are ad-hoc signed and not notarized.",
              "macOS blocks them when they come from the internet, and they cannot update themselves.",
              "Use them only to test the build. Never attach them to a release.",
              "",
            ].join("\n"));
            expected = [...packages, "NOT-FOR-RELEASE.txt"];
          }

          const staged = readdirSync(stage).sort();
          if (JSON.stringify(staged) !== JSON.stringify([...expected].sort())) fail(`unexpected file set: ${staged.join(", ")}`);
          const table = staged.map((file) => `| \`${file}\` | ${statSync(join(stage, file)).size} |`).join("\n");
          const title = signed ? `Seira ${version} for macOS` : `Seira ${version} for macOS: NOT FOR RELEASE (ad-hoc signed, not notarized)`;
          console.log(staged.join("\n"));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### ${title}\n\n| File | Bytes |\n| --- | --- |\n${table}\n`);
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: ${{ runner.temp }}/seira-macos/
          if-no-files-found: error
          retention-days: 14

      - name: Delete the temporary keychain
        if: always() && steps.mode.outputs.signed == 'true'
        run: security delete-keychain "$RUNNER_TEMP/seira-signing.keychain-db" || true
