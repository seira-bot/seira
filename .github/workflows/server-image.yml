name: Server image

# The publish job waits until a reviewer approves the `release` environment,
# which accepts runs from `main` only (docs/ci.md).

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/server-image.yml
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and publish, like v0.1.173. Empty publishes main as latest.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: server-image-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: build image and boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag must look like v0.1.173."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Build image
        run: docker build -t seira-server:ci .
      - name: Boot the container and prove the server and UI answer
        run: |
          set -euo pipefail
          docker run -d --name seira seira-server:ci
          for i in $(seq 1 40); do
            if docker exec seira curl -sf http://127.0.0.1:8799/api/health | grep -q openmausbot; then break; fi
            sleep 2
            if [ "$i" = "40" ]; then docker logs seira; echo "server never became healthy"; exit 1; fi
          done
          docker exec seira curl -sf http://127.0.0.1:8799/ | grep -qi "<html" || { docker logs seira; echo "UI not served"; exit 1; }
          test "$(docker exec seira id -un)" = maus || { docker logs seira; echo "server does not run as maus"; exit 1; }
          docker logs seira | tail -5

  publish:
    name: publish to GHCR
    needs: smoke
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ inputs.tag == '' }}
            type=raw,value=sha-${{ steps.commit.outputs.sha }},enable=${{ inputs.tag == '' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            ${{ inputs.tag != '' && format('org.opencontainers.image.version={0}', inputs.tag) || '' }}
      - id: keys
        # `agent-browser install` fetches Chrome for Testing's last-known-good
        # Stable. An arm64 image takes Debian's Chromium instead. A failed lookup
        # keys on today's date, so a build never keeps an old browser.
        run: |
          today="date-$(date -u +%F)"
          chrome=$(curl -fsSL --max-time 30 https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json | jq -er .channels.Stable.version) || chrome=""
          [[ "$chrome" =~ ^[0-9]+(\.[0-9]+)+$ ]] || chrome=$today
          chromium=$(curl -fsSL --max-time 30 'https://qa.debian.org/madison.php?package=chromium&s=bookworm,bookworm-security&a=arm64&text=on' | awk -F'|' '{gsub(/ /, "", $2); print $2}' | sort -V | tail -n 1) || chromium=""
          [[ "$chromium" =~ ^[0-9][0-9A-Za-z.+~:-]*$ ]] || chromium=$today
          { echo "chrome=$chrome"; echo "chromium=$chromium"; } | tee -a "$GITHUB_OUTPUT"
      - name: Sign in to ghcr.io
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CHROME_CACHE_TAG=${{ steps.keys.outputs.chrome }}
            CHROMIUM_CACHE_TAG=${{ steps.keys.outputs.chromium }}
      - name: Sign out of ghcr.io
        if: always()
        run: docker logout ghcr.io
      - name: Write the published image to the run summary
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "Published \`${IMAGE,,}@${DIGEST}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
