name: Server image

# The repository allows GitHub's own actions only, so the runner's docker CLI
# builds and publishes. Each platform builds on its own native runner.
# A run that a person outside the repository variable RELEASE_MAINTAINERS starts
# waits for a maintainer's approval in the `release-approval` environment.
# A maintainer's run does not wait. The publish job uses the `release`
# environment, which accepts runs from `main` only (docs/ci.md).
# The publish job runs only if a maintainer started this attempt, or if the
# approval came in this same attempt. A re-run by another person therefore
# never reuses an approval of an earlier attempt.

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/server-image.yml
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and publish, like v0.1.173. Empty publishes main as latest.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: server-image-${{ github.event_name == 'workflow_dispatch' && 'publish' || github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: build and smoke (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check the release tag
        env:
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [ -n "$TAG" ] || exit 0
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag must look like v0.1.173."
            exit 1
          fi
          curl -fsS -o /dev/null "https://api.github.com/repos/$REPOSITORY/releases/tags/$TAG" || { echo "$TAG is not a published release."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - id: keys
        # `agent-browser install` fetches Chrome for Testing's last-known-good
        # Stable. An arm64 image takes Debian's Chromium instead. A failed lookup
        # keys on today's date, so a build never keeps an old browser.
        run: |
          today="date-$(date -u +%F)"
          chrome=$(curl -fsSL --max-time 30 https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json | jq -er .channels.Stable.version) || chrome=""
          [[ "$chrome" =~ ^[0-9]+(\.[0-9]+)+$ ]] || chrome=$today
          chromium=$(curl -fsSL --max-time 30 'https://qa.debian.org/madison.php?package=chromium&s=bookworm,bookworm-security&a=arm64&text=on' | awk -F'|' '{gsub(/ /, "", $2); print $2}' | sort -V | tail -n 1) || chromium=""
          [[ "$chromium" =~ ^[0-9][0-9A-Za-z.+~:-]*$ ]] || chromium=$today
          { echo "chrome=$chrome"; echo "chromium=$chromium"; } | tee -a "$GITHUB_OUTPUT"
      - name: Build image
        # deploy/install.sh and deploy/update.sh read the version label: a
        # release tag there means an image the app can update. Without
        # attestations each platform is one manifest in either Docker image store.
        env:
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          ARCH: ${{ matrix.arch }}
          CHROME: ${{ steps.keys.outputs.chrome }}
          CHROMIUM: ${{ steps.keys.outputs.chromium }}
        run: |
          docker build --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=${TAG:-main}" \
            --build-arg "CHROME_CACHE_TAG=$CHROME" \
            --build-arg "CHROMIUM_CACHE_TAG=$CHROMIUM" \
            -t seira-server:ci .
          [ "$(docker image inspect -f '{{.Architecture}}' seira-server:ci)" = "$ARCH" ] || { echo "The image is not an $ARCH image."; exit 1; }
      - name: Boot the container and prove the server and UI answer
        run: |
          set -euo pipefail
          docker run -d -e OMB_COMPOSIO_BROKER=off --name seira seira-server:ci
          for i in $(seq 1 40); do
            if docker exec seira curl -sf http://127.0.0.1:8799/api/health | grep -q openmausbot; then break; fi
            sleep 2
            if [ "$i" = "40" ]; then docker logs seira; echo "server never became healthy"; exit 1; fi
          done
          docker exec seira curl -sf http://127.0.0.1:8799/ | grep -qi "<html" || { docker logs seira; echo "UI not served"; exit 1; }
          test "$(docker exec seira id -un)" = maus || { docker logs seira; echo "server does not run as maus"; exit 1; }
          docker logs seira | tail -5
          docker rm -f seira >/dev/null
      - name: Save the image for the publish job
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag seira-server:ci "seira-server:$ARCH"
          docker save "seira-server:$ARCH" | gzip -1 > "seira-server-$ARCH.tar.gz"
      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seira-server-${{ matrix.arch }}
          path: seira-server-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  approval:
    name: approval for a person outside the maintainers
    needs: image
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !(startsWith(vars.RELEASE_MAINTAINERS || '[]', '[') && contains(fromJSON(vars.RELEASE_MAINTAINERS || '[]'), github.triggering_actor))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-approval
    permissions: {}
    outputs:
      attempt: ${{ github.run_attempt }}
    steps:
      - run: echo "A maintainer approved this run."

  publish:
    name: publish to GHCR
    needs: [image, approval]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.image.result == 'success' && ((startsWith(vars.RELEASE_MAINTAINERS || '[]', '[') && contains(fromJSON(vars.RELEASE_MAINTAINERS || '[]'), github.triggering_actor)) || (needs.approval.result == 'success' && needs.approval.outputs.attempt == github.run_attempt)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: seira-server-*
          path: images
          merge-multiple: true
      - name: Load the images
        run: for arch in amd64 arm64; do gunzip -c "images/seira-server-$arch.tar.gz" | docker load; done
      - name: Sign in to ghcr.io
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: Publish both platforms under one tag
        env:
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          # A multi-platform tag names each platform's image by its digest, and
          # an image has a registry digest only after a push. So each platform
          # goes to its own build tag first. The checks read the pushed image
          # from the registry, because this runner cannot run an arm64 image.
          sources=()
          revisions=()
          for arch in amd64 arm64; do
            docker tag "seira-server:$arch" "$image:build-$arch"
            docker push -q "$image:build-$arch"
            ref="$image@$(docker buildx imagetools inspect "$image:build-$arch" --format '{{json .Manifest}}' | jq -r .digest)"
            config=$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}' | jq -c --arg p "linux/$arch" 'if has("architecture") then . else .[$p] end')
            [ "$(jq -r .architecture <<<"$config")" = "$arch" ] || { echo "build-$arch is not an $arch image."; exit 1; }
            [ "$(jq -r '.config.Labels["org.opencontainers.image.version"]' <<<"$config")" = "${TAG:-main}" ] || { echo "build-$arch has the wrong version label."; exit 1; }
            revisions+=("$(jq -r '.config.Labels["org.opencontainers.image.revision"]' <<<"$config")")
            sources+=("$ref")
          done
          [ "${revisions[0]}" = "${revisions[1]}" ] || { echo "The two images come from different commits."; exit 1; }
          if [ -n "$TAG" ]; then tags=("$TAG"); else tags=(latest "sha-${revisions[0]}"); fi
          targets=()
          for tag in "${tags[@]}"; do targets+=(-t "$image:$tag"); done
          docker buildx imagetools create "${targets[@]}" "${sources[@]}"
          {
            echo "Published \`$image\` with the tags: ${tags[*]}"
            echo '```'
            docker buildx imagetools inspect "$image:${tags[0]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Sign out of ghcr.io
        if: always()
        run: docker logout ghcr.io
