name: Server image

# The repository allows GitHub's own actions only, so the runner's docker CLI
# builds and publishes. Each platform builds on its own native runner.
# The `gate` job runs scripts/release-gate.mjs on the commit of this run. It reads every commit since the last version on npm.
# A run that passes the gate publishes with no person.
# A run that the gate flags waits for the wait timer of the `release-approval` environment. A maintainer can cancel it during the wait.
# A run that the gate refuses does not publish.
# The publish job runs only on `main`. It uses the `release` environment, which accepts runs from `main` only (docs/ci.md).
# It runs only if the gate passed, or if the wait ended in this same attempt.
# A re-run therefore never reuses the wait of an earlier attempt.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and publish, like v0.1.173. Empty publishes main as latest.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: server-image-publish
  cancel-in-progress: false

jobs:
  image:
    name: build and smoke
    uses: ./.github/workflows/server-image-smoke.yml
    with:
      tag: ${{ inputs.tag }}
      save: ${{ github.ref == 'refs/heads/main' }}

  gate:
    name: release gate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pass: ${{ steps.gate.outputs.pass }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run the release gate
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_HUMAN_REVIEWERS: ${{ vars.RELEASE_HUMAN_REVIEWERS }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          node scripts/release-gate.mjs --sha "$SHA"
          status=$?
          case "$status" in
            0) echo "pass=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "pass=false" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

  approval:
    name: approval for a run that the gate flagged
    needs: gate
    if: ${{ needs.gate.outputs.pass == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-approval
    permissions: {}
    outputs:
      attempt: ${{ github.run_attempt }}
    steps:
      - run: echo "The wait of the release-approval environment ended."

  publish:
    name: publish to GHCR
    needs: [image, gate, approval]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.image.result == 'success' && needs.gate.result == 'success' && (needs.gate.outputs.pass == 'true' || (needs.approval.result == 'success' && needs.approval.outputs.attempt == github.run_attempt)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: seira-server-*
          path: images
          merge-multiple: true
      - name: Load the images
        run: for arch in amd64 arm64; do gunzip -c "images/seira-server-$arch.tar.gz" | docker load; done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seira-cloud-home-amd64
          path: images
      - name: Load the cloud-home image
        run: gunzip -c images/seira-cloud-home-amd64.tar.gz | docker load
      - name: Sign in to ghcr.io
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: Publish both platforms under one tag
        env:
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          # A multi-platform tag names each platform's image by its digest, and
          # an image has a registry digest only after a push. So each platform
          # goes to its own build tag first. The checks read the pushed image
          # from the registry, because this runner cannot run an arm64 image.
          sources=()
          revisions=()
          for arch in amd64 arm64; do
            docker tag "seira-server:$arch" "$image:build-$arch"
            docker push -q "$image:build-$arch"
            ref="$image@$(docker buildx imagetools inspect "$image:build-$arch" --format '{{json .Manifest}}' | jq -r .digest)"
            config=$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}' | jq -c --arg p "linux/$arch" 'if has("architecture") then . else .[$p] end')
            [ "$(jq -r .architecture <<<"$config")" = "$arch" ] || { echo "build-$arch is not an $arch image."; exit 1; }
            [ "$(jq -r '.config.Labels["org.opencontainers.image.version"]' <<<"$config")" = "${TAG:-main}" ] || { echo "build-$arch has the wrong version label."; exit 1; }
            revisions+=("$(jq -r '.config.Labels["org.opencontainers.image.revision"]' <<<"$config")")
            sources+=("$ref")
          done
          [ "${revisions[0]}" = "${revisions[1]}" ] || { echo "The two images come from different commits."; exit 1; }
          if [ -n "$TAG" ]; then tags=("$TAG"); else tags=(latest "sha-${revisions[0]}"); fi
          targets=()
          for tag in "${tags[@]}"; do targets+=(-t "$image:$tag"); done
          docker buildx imagetools create "${targets[@]}" "${sources[@]}"
          {
            echo "Published \`$image\` with the tags: ${tags[*]}"
            echo '```'
            docker buildx imagetools inspect "$image:${tags[0]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the cloud-home image
        env:
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          image="$image-cloud-home"
          docker tag seira-cloud-home:amd64 "$image:build-amd64"
          docker push -q "$image:build-amd64"
          ref="$image@$(docker buildx imagetools inspect "$image:build-amd64" --format '{{json .Manifest}}' | jq -r .digest)"
          config=$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}' | jq -c 'if has("architecture") then . else .["linux/amd64"] end')
          [ "$(jq -r .architecture <<<"$config")" = amd64 ] || { echo "The cloud-home image is not an amd64 image."; exit 1; }
          version=$(jq -r '.config.Labels["org.opencontainers.image.version"]' <<<"$config")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "The cloud-home image has no semver version label."; exit 1; }
          [ -z "$TAG" ] || [ "$version" = "${TAG#v}" ] || { echo "The cloud-home image has the wrong version label."; exit 1; }
          revision=$(jq -r '.config.Labels["org.opencontainers.image.revision"]' <<<"$config")
          if [ -n "$TAG" ]; then tags=("$TAG"); else tags=(latest "sha-$revision"); fi
          targets=()
          for tag in "${tags[@]}"; do targets+=(-t "$image:$tag"); done
          docker buildx imagetools create "${targets[@]}" "$ref"
          {
            echo "Published \`$image\` with the tags: ${tags[*]}"
            echo "Digest: \`$(docker buildx imagetools inspect "$image:${tags[0]}" --format '{{json .Manifest}}' | jq -r .digest)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Sign out of ghcr.io
        if: always()
        run: docker logout ghcr.io
