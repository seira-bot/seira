name: ${COMPOSE_PROJECT_NAME:-seira}
services:
  seira:
    # Collects exited browser processes; Chrome's shared memory as on the
    # desktop containers (docs/browser-packaging.md, "Process hygiene").
    init: true
    shm_size: 512m
    build:
      context: ./deploy/local
      args:
        BASE_IMAGE: ${SEIRA_BASE_IMAGE:-ghcr.io/seira-bot/seira:latest}
        ENGINES: ${ENGINES-@anthropic-ai/claude-code @openai/codex}
    image: ${SEIRA_LOCAL_IMAGE:-seira-local:latest}
    restart: unless-stopped
    volumes:
      - data:/data
      - edge:/run/seira
    environment:
      SEIRA_PORT: "8799"
      SEIRA_WEBHOOK_PORT: "8800"
      # Caddy, in its own container, reaches the server over these (deploy/local/Caddyfile). A request on a socket is
      # never a local one. Caddy does not share the server's network: a server restarted on its own would come back
      # in a new one and leave Caddy, and the port, behind in the old one.
      SEIRA_TUNNEL_SOCKET: /run/seira/http.sock
      SEIRA_WEBHOOK_SOCKET: /run/seira/hooks.sock
      # The name the desktop app shows for this server (a container's own hostname is a random id).
      SEIRA_SERVER_NAME: ${SEIRA_SERVER_NAME:-seira-docker}
      SEIRA_PUBLIC_URL: ${SEIRA_PUBLIC_URL:-http://localhost:${SEIRA_HTTP_PORT:-8080}}
      SEIRA_WEBHOOK_PUBLIC_URL: ${SEIRA_WEBHOOK_PUBLIC_URL:-${SEIRA_PUBLIC_URL:-http://localhost:${SEIRA_HTTP_PORT:-8080}}}
      # "1": phones pair by QR through Seira Relay (docs/phone-relay-server.md). Sign the
      # container in once first: docker compose exec seira seira login --relay
      SEIRA_PHONE_RELAY: ${SEIRA_PHONE_RELAY:-}
      # Empty: Seira's push relay for alerts to a closed phone app (docs/phone-push.md).
      SEIRA_PUSH_RELAY_URL: ${SEIRA_PUSH_RELAY_URL:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8799/api/health', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok || !(await r.text()).includes('seira')) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    ports:
      - "${SEIRA_BIND_ADDRESS:-127.0.0.1}:${SEIRA_HTTP_PORT:-8080}:80"
    environment:
      SEIRA_HTTPS_HOST: ${SEIRA_HTTPS_HOST:-}
      SEIRA_BIND_ADDRESS: ${SEIRA_BIND_ADDRESS:-127.0.0.1}
      SEIRA_TRUSTED_PROXY_CIDRS: ${SEIRA_TRUSTED_PROXY_CIDRS:-}
    command:
      - /bin/sh
      - -ec
      - |
        # HTTPS is claimed by the peer that terminates TLS, so a bind address
        # that others can reach has to name that peer.
        if [ -n "$$SEIRA_HTTPS_HOST" ] && [ "$$SEIRA_BIND_ADDRESS" != "127.0.0.1" ] && [ -z "$$SEIRA_TRUSTED_PROXY_CIDRS" ]; then
          echo "SEIRA_HTTPS_HOST with SEIRA_BIND_ADDRESS=$$SEIRA_BIND_ADDRESS requires SEIRA_TRUSTED_PROXY_CIDRS naming the TLS terminator; forward HTTPS through that terminator." >&2
          exit 1
        fi
        # An empty list lets any peer claim the HTTPS hostname, which only the
        # loopback bind keeps to the host itself.
        export SEIRA_TRUSTED_PROXY_CIDRS="$${SEIRA_TRUSTED_PROXY_CIDRS:-0.0.0.0/0 ::/0}"
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    # Started with the server, not after it is healthy: Caddy reaches it over the socket
    # whenever it answers, so `up` never waits on the server's health, and HTTPS is back
    # as soon as a restarted server is.
    depends_on:
      seira:
        condition: service_started
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - edge:/run/seira
      - caddy_data:/data
      - caddy_config:/config
volumes:
  data:
    external: ${SEIRA_DATA_EXTERNAL:-false}
    name: ${SEIRA_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-seira}_data}
  # The two sockets: in memory, made afresh by the server at each start. Not under /data, which every bot's sandbox
  # sees; the sandbox has its own /run.
  edge:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: mode=1777,size=1m
  caddy_data:
  caddy_config:
